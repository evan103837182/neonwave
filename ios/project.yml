name: NEONWAVE
options:
  bundleIdPrefix: com.evan
  deploymentTarget:
    iOS: "15.0"
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    from: 5.0.1
targets:
  NEONWAVE:
    type: application
    platform: iOS
    sources:
      - path: NEONWAVE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evan.neonwave
        PRODUCT_NAME: NEONWAVE
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: SpotifyiOS
    info:
      path: NEONWAVE/Info.plist
      properties:
        CFBundleDisplayName: NEONWAVE
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBG
        LSApplicationQueriesSchemes: [spotify]
        CFBundleURLTypes:
          - CFBundleURLName: com.evan.neonwave
            CFBundleURLSchemes: [neonwave]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
schemes:
  NEONWAVE:
    build:
      targets:
        NEONWAVE: all
