name: Build iPhone app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project NEONWAVE.xcodeproj -scheme NEONWAVE -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: Package .ipa
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/NEONWAVE.app
          ls -la "$APP" "$APP/Frameworks" || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry NEONWAVE.ipa Payload
          ls -la NEONWAVE.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NEONWAVE-ipa
          path: ios/NEONWAVE.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ github.run_number }}
          name: NEONWAVE iPhone app (build ${{ github.run_number }})
          body: Download NEONWAVE.ipa below and install it with Sideloadly.
          files: ios/NEONWAVE.ipa
          make_latest: true
